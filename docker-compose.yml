services:
  reactapp:
    container_name: ticktickpos-react
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
      - "5174:5174"   # WebSocket port for HMR
    volumes:
      - ./react-frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - goapp

  goapp:
    container_name: ticktickpos-api
    build:
      context: ./server
      dockerfile: Dockerfile
    command: air
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app
    working_dir: /app
    depends_on:
      - postgres

  postgres:
    image: postgres:latest
    container_name: ticktickpos-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ticktickpos-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data: